<!doctype html>
<meta charset="utf-8">
<title>agent-beeps render host</title>
<script type="module">
  import { renderOffline, renderSongOffline, songChunk, songChannels, freeSong } from './engine/offline.js';
  import { renderLooks, renderSongLook } from './look.js';
  window.beepsLooks = (items, sheet) => renderLooks(items, sheet);
  // Each item renders alone, so one bad patch never fails the batch.
  window.beepsRender = items => Promise.all(items.map(i =>
    renderOffline(i.patch, i.opts).catch(e => ({ error: String(e && e.message || e) }))));
  window.beepsRenderSong = (song, instruments) => renderSongOffline(song, instruments);
  window.beepsSongChunk = (id, ch, start, count) => songChunk(id, ch, start, count);
  window.beepsSongLook = (id, features, label) => renderSongLook(songChannels(id), features, label);
  window.beepsFreeSong = id => freeSong(id);
  window.beepsReady = true;
</script>
