<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album · agent-beeps</title>
  <link rel="stylesheet" href="/runtime/audition/style.css">
  <link rel="stylesheet" href="/runtime/audition/album.css">
</head>
<body>
  <main class="deck">
    <header class="plate">
      <div>
        <div class="brand">agent-beeps · listening booth · album</div>
        <h1 class="prompt" id="title">Loading album</h1>
      </div>
      <div class="meta" id="meta"></div>
    </header>

    <section class="transport" aria-label="Now playing">
      <div class="np">
        <div class="np-label">Now playing</div>
        <div class="np-title" id="np-title">Pick a track</div>
        <div class="np-desc" id="np-desc"></div>
      </div>
      <div class="controls">
        <button class="deckkey" id="prev" aria-label="Previous track">⏮</button>
        <button class="deckkey big" id="play" aria-label="Play">▶</button>
        <button class="deckkey" id="next" aria-label="Next track">⏭</button>
      </div>
      <div class="group modes">
        <span>Repeat</span>
        <button class="toggle" data-repeat="album" aria-pressed="true">Album</button>
        <button class="toggle" data-repeat="track" aria-pressed="false">Track</button>
        <button class="toggle" id="seam" title="Jump to 8 s before the loop point and repeat the track">Hear the seam</button>
      </div>
      <div class="scrub">
        <div class="strip big" id="np-strip" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <div class="clock"><span id="pos">0:00</span><span id="sec"></span><span id="dur">0:00</span></div>
      </div>
    </section>

    <ol class="tracks" id="tracks"></ol>

    <section class="album-note">
      <label for="album-note">Notes on the whole album</label>
      <textarea id="album-note" rows="3" placeholder="What should the next batch do more or less of?"></textarea>
      <div class="saved" id="album-saved" aria-live="polite"></div>
    </section>
  </main>
  <audio id="audio" preload="metadata"></audio>
  <script type="module" src="/runtime/audition/album.js"></script>
</body>
</html>
