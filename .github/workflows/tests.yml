name: Full test suite
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the approved encoder binary
        run: npm rebuild ffmpeg-static
      - run: npx playwright install --with-deps chromium
      - name: Require the test runtimes
        run: node scripts/ci-suite.mjs preflight
      - run: npm run typecheck
      - name: Run every test with two workers
        run: npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local/ci/vitest.json
      - name: Check and summarize results and legitimate skips
        if: always()
        run: node scripts/ci-suite.mjs report .local/ci/vitest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-results
          path: .local/ci/vitest.json
          if-no-files-found: warn
          retention-days: 7
